<!--
  TAZAWWUD — Custom Icon Sprite
  ----------------------------------------------------------------------------
  Material Symbols (and every other free icon set: Phosphor, Feather, Lucide,
  Font Awesome Free) has no glyphs for a praying figure, the Kaaba, or tasbih
  beads. Rather than force a poor substitute, these 3 are hand-drawn as a
  tiny inline sprite. Everything else in the app uses Material Symbols Rounded.

  Usage:
    <svg class="icon icon--custom" aria-hidden="true">
      <use href="/icons/custom-icons.svg#icon-salah"></use>
    </svg>

  All shapes use stroke/fill="currentColor" so they inherit CSS `color`,
  exactly like the Material Symbols font glyphs do.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">

  <!-- Salah: a simplified figure in sujud (prostration) on a prayer mat -->
  <symbol id="icon-salah" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="6" r="1.6" fill="currentColor" stroke="none" />
    <path d="M7 7.6v3.4l3 1.8" />
    <path d="M10 12.8h4.5" />
    <path d="M14.5 12.8l2.5-3.2" />
    <rect x="2.5" y="16.5" width="19" height="3.4" rx="1" />
  </symbol>

  <!-- Kaaba: cube draped with a kiswah band -->
  <symbol id="icon-kaaba" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8.5 12 4l8 4.5v8L12 21l-8-4.5z" />
    <path d="M4 8.5 12 13l8-4.5" />
    <path d="M12 13v8" />
    <path d="M4 12.6 12 17l8-4.4" />
  </symbol>

  <!-- Tasbih: prayer beads with counter -->
  <symbol id="icon-tasbih" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <path d="M6 5c-3 3-3 11 0 14" />
    <path d="M18 5c3 3 3 11 0 14" />
    <circle cx="7.2" cy="6.2" r="1.3" fill="currentColor" stroke="none" />
    <circle cx="5.2" cy="9.6" r="1.3" fill="currentColor" stroke="none" />
    <circle cx="4.6" cy="13.6" r="1.3" fill="currentColor" stroke="none" />
    <circle cx="5.6" cy="17.4" r="1.3" fill="currentColor" stroke="none" />
    <circle cx="7.8" cy="20.2" r="1.3" fill="currentColor" stroke="none" />
    <rect x="10" y="10" width="4" height="5" rx="0.6" fill="currentColor" stroke="none" />
  </symbol>

</svg>
