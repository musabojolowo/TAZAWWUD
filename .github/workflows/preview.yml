name: Preview TAZAWWUD (no live change)

on:
  push:
    branches:
      - preview-test

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to a preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TAZAWWUD_4028B }}
          channelId: preview
          projectId: tazawwud-4028b
          expires: 7d
